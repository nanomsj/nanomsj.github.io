name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [ source ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Show environment
        run: node -v && npm -v
      - name: Install dependencies
        run: npm ci --no-audit --no-fund --legacy-peer-deps --registry=https://registry.npmjs.org --replace-registry-host=always
      - name: Verify sharp
        run: node -e "const s=require('sharp'); console.log('sharp OK', s.versions)"
      - name: Build site
        run: |
          npm run build 2>&1 | tee /tmp/build.log
          exit ${PIPESTATUS[0]}
      - name: Publish build log
        if: always()
        run: |
          mkdir /tmp/logrepo && cd /tmp/logrepo
          git init -q
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git fetch -q --depth=1 origin ci-logs || true
          git checkout -q -B ci-logs FETCH_HEAD 2>/dev/null || git checkout -q -B ci-logs
          cp /tmp/build.log ./build.log
          echo "workflow_sha: ${{ github.sha }}" >> ./build.log
          git add build.log
          git -c user.name=ci -c user.email=ci@github.com commit -q -m "build log" || true
          git push -q -f origin HEAD:ci-logs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
